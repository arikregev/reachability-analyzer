# reachability-api configuration. Keys are documented in docs/architecture.md section 12.

quarkus.application.name=reachability-api
# Other services' reach.* keys may share the same ConfigMap.
smallrye.config.mapping.validate-unknown=false

# --- Priority classes seeded into scan.priority_class (D-007) ---
reach.queue.classes.critical.weight=1000
reach.queue.classes.pr.weight=500
reach.queue.classes.default.weight=100
reach.queue.classes.bulk.weight=10
reach.queue.classes.bulk.max-running=20

# --- Postgres and Liquibase (D-031). The API applies the changelog; other services validate only. ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18-alpine
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# --- Auth (D-024). Any OIDC provider; roles come from the token's groups claim. ---
# Map provider group names to the service roles with quarkus.http.auth.roles-mapping."<group>"=<role>.
quarkus.oidc.roles.role-claim-path=groups
quarkus.oidc.application-type=service
# Lazy authentication, so 401/403 responses carry problem+json bodies (architecture.md 5.4a a).
quarkus.http.auth.proactive=false
quarkus.keycloak.devservices.enabled=false

# --- Kafka intake (D-005, D-006) ---
mp.messaging.incoming.scan-requests.connector=smallrye-kafka
mp.messaging.incoming.scan-requests.topic=appsec.reachability.requests.v1
mp.messaging.incoming.scan-requests.group.id=reachability-api
mp.messaging.incoming.scan-requests.key.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.scan-requests.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.scan-requests.auto.offset.reset=earliest
# Postgres stays unavailable after the retries: stop consuming and report unhealthy instead of losing records.
mp.messaging.incoming.scan-requests.failure-strategy=fail
mp.messaging.outgoing.scan-requests-dlq.connector=smallrye-kafka
mp.messaging.outgoing.scan-requests-dlq.topic=appsec.reachability.requests.dlq.v1
mp.messaging.outgoing.scan-requests-dlq.key.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.outgoing.scan-requests-dlq.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
mp.messaging.outgoing.scan-requests-dlq.acks=all

# --- HTTP, health, metrics, OpenAPI ---
quarkus.smallrye-openapi.info-title=reachability-api
quarkus.swagger-ui.always-include=false

# --- Tests: Postgres from Dev Services (Testcontainers); Kafka channels in memory ---
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.mp.messaging.incoming.scan-requests.connector=smallrye-in-memory
%test.mp.messaging.outgoing.scan-requests-dlq.connector=smallrye-in-memory
%test.reach.auth.kafka-priority-classes=critical
%test.reach.github.allowed-hosts=github.com,github.acme.internal

# --- Local profile (-Dquarkus.profile=local): the deploy/local docker-compose stack and token.sh mock IdP ---
%local.quarkus.datasource.devservices.enabled=false
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/reach
%local.quarkus.datasource.username=reach
%local.quarkus.datasource.password=reach
%local.quarkus.kafka.devservices.enabled=false
%local.kafka.bootstrap.servers=localhost:9092
%local.quarkus.oidc.public-key=${REACH_LOCAL_PUBLIC_KEY}
%local.quarkus.oidc.token.issuer=reach-local
%local.quarkus.oidc.token.audience=reachability-api
