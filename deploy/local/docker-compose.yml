# Local stack for manual testing of reachability-api (Postgres + Kafka). Not for production.
# Usage: see deploy/local/README.md. Image names can be overridden, e.g. POSTGRES_IMAGE=mirror.gcr.io/library/postgres:18-alpine
name: reach-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: reach
      POSTGRES_USER: reach
      POSTGRES_PASSWORD: reach
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reach -d reach"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates the topics of architecture.md 5.4 once the broker is up.
  kafka-topics:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: service:kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in appsec.reachability.requests.v1 appsec.reachability.requests.dlq.v1 \
                 appsec.reachability.status.v1 appsec.reachability.results.v1 appsec.reachability.exports.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: "no"
