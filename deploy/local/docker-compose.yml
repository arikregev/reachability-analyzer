# Local stack with mock backends for manual runs of the services (D-034). Not for production.
# Usage: see deploy/local/README.md. Image names can be overridden, e.g. POSTGRES_IMAGE=mirror.gcr.io/library/postgres:18-alpine
name: reach-local

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: reach
      POSTGRES_USER: reach
      POSTGRES_PASSWORD: reach
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reach -d reach"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates the topics of architecture.md 5.4 once the broker is up.
  kafka-topics:
    image: ${KAFKA_IMAGE:-apache/kafka:4.1.0}
    depends_on:
      kafka:
        condition: service_healthy
    network_mode: service:kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in appsec.reachability.requests.v1 appsec.reachability.requests.dlq.v1 \
                 appsec.reachability.status.v1 appsec.reachability.results.v1 appsec.reachability.exports.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: "no"

  # HashiCorp Vault in dev mode, holding the DT API key as scan-controller reads it (D-032).
  vault:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.20}
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: reach-dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 30

  vault-init:
    image: ${VAULT_IMAGE:-hashicorp/vault:1.20}
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: reach-dev-root
    volumes:
      - ./.keys:/keys:ro
    # The GitHub App key is the token.sh key pair; run deploy/local/token.sh --public-key before the first start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vault kv put secret/reach/dt api-key-read=local-dt-key
        vault kv put secret/reach/github private-key=@/keys/private.pem
    restart: "no"

  # Mock Dependency-Track 5.x: the same WireMock stubs the scan-controller tests use.
  dependency-track:
    image: ${WIREMOCK_IMAGE:-wiremock/wiremock:3.13.2}
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ../../scan-controller/src/test/resources/wiremock/dt/mappings:/home/wiremock/mappings:ro
      - ../../scan-controller/src/test/resources/wiremock/dt/__files:/home/wiremock/__files:ro
    ports:
      - "8089:8080"

  # Mock GitHub REST API: the same WireMock stubs the scan-controller tests use (installation, token, commits).
  github:
    image: ${WIREMOCK_IMAGE:-wiremock/wiremock:3.13.2}
    command: ["--port", "8080", "--verbose"]
    volumes:
      - ../../scan-controller/src/test/resources/wiremock/github/mappings:/home/wiremock/mappings:ro
    ports:
      - "8091:8080"

  # Mock S3 with the local bucket.
  s3:
    image: ${S3MOCK_IMAGE:-adobe/s3mock:5.2.3}
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: reach-local
    ports:
      - "9090:9090"
