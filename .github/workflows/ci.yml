name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Tests use Testcontainers (Postgres and Vault Dev Services, s3mock); the runner has Docker.
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Test the source-fetch script
        run: |
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          images/source-fetch/test.sh
      - name: Build the source-fetch image
        run: docker build -t reach/source-fetch:ci images/source-fetch
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
