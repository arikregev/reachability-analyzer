name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to commit SHAs; Dependabot proposes updates (D-041).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Tests use Testcontainers (Postgres and Vault Dev Services, s3mock); the runner has Docker.
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Test the source-fetch script
        run: |
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          images/source-fetch/test.sh
      - name: Build the source-fetch image
        run: docker build -t reach/source-fetch:ci images/source-fetch
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
