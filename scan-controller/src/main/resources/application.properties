# scan-controller configuration. Keys are documented in docs/architecture.md section 12.

quarkus.application.name=scan-controller
smallrye.config.mapping.validate-unknown=false
quarkus.http.port=8081

# Loop intervals (scheduler syntax).
reach.queue.claim-interval=PT2S
reach.queue.sweep-interval=PT1M
reach.leader.check-interval=PT5S
reach.outbox.poll-interval=PT1S
reach.outbox.purge-cron=0 30 3 * * ?
reach.metrics.refresh-interval=PT15S

# --- Postgres. reachability-api applies the Liquibase changelog; this service only checks it (D-031). ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:18-alpine
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.liquibase.migrate-at-start=false

# --- Dependency-Track 5.x (D-003). The API key comes from Vault (D-032). ---
quarkus.rest-client.dt.url=${reach.dt.url}
quarkus.rest-client.dt.connect-timeout=5000
quarkus.rest-client.dt.read-timeout=30000

# --- Vault (D-032): KV v2 secret reach/dt holds api-key-read, exposed as reach.dt.api-key-read ---
quarkus.vault.secret-config-kv-path."reach.dt"=reach/dt
quarkus.vault.secret-config-cache-period=${reach.dt.api-key-refresh:5M}
%prod.quarkus.vault.authentication.kubernetes.role=scan-controller

# --- S3 (D-016): input bundle, Job work files, results. Credentials from the default AWS chain. ---
reach.s3.bucket=${REACH_S3_BUCKET:reach-results}
reach.s3.region=${REACH_S3_REGION:us-east-1}

# --- GitHub App (D-032): installation tokens for the source-fetch Job. The private key is read from Vault
# KV v2 reach/github, field private-key, exposed as reach.github.private-key. ---
quarkus.rest-client.github.url=${reach.github.api-url:https://api.github.com}
quarkus.rest-client.github.connect-timeout=5000
quarkus.rest-client.github.read-timeout=30000
%prod.quarkus.vault.secret-config-kv-path."reach.github"=reach/github

# --- Jobs (architecture.md 3.3, 3.4, 9). Images are pinned by digest in production. ---
reach.job.fetch.image=${REACH_SOURCE_FETCH_IMAGE:reach/source-fetch:dev}
reach.job.fetch.namespace=reach-fetch
reach.job.fetch.service-account=reach-fetch
reach.job.fetch.active-deadline=PT10M
reach.job.fetch.cpu=1
reach.job.fetch.memory=1Gi
reach.job.fetch.ephemeral-storage=12Gi
reach.job.fetch.work-size=11Gi
reach.job.scan.image=${REACH_SCANNER_IMAGE:reach/scanner:dev}
reach.job.scan.namespace=reach-scan
reach.job.scan.service-account=reach-scan
reach.job.scan.active-deadline=PT45M
reach.job.scan.cpu=4
reach.job.scan.memory=16Gi
reach.job.scan.ephemeral-storage=50Gi
reach.job.scan.work-size=40Gi

# --- Kafka: outbox relay. The topic comes from each outbox row. ---
mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.topic=appsec.reachability.status.v1
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.acks=all
mp.messaging.outgoing.outbox.enable.idempotence=true

# --- Tests: Dev Services Postgres (schema applied here), Vault Dev Services, WireMock DT, in-memory Kafka ---
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.scheduler.enabled=false
%test.quarkus.kafka.devservices.enabled=false
%test.mp.messaging.outgoing.outbox.connector=smallrye-in-memory
%test.quarkus.vault.devservices.image-name=hashicorp/vault:1.20
%test.quarkus.vault.devservices.init-commands=kv put secret/reach/dt api-key-read=test-dt-key
%test.reach.dt.page-size=2
# S3 (adobe/s3mock), GitHub (WireMock) and the Kubernetes API (Fabric8 mock server) come from test resources.
%test.reach.github.app-id=12345
%test.reach.job.fetch.namespace=reach-test
%test.reach.job.scan.namespace=reach-test
%test.quarkus.kubernetes-client.devservices.enabled=false

# --- Local profile (-Dquarkus.profile=local): the deploy/local docker-compose stack ---
%local.quarkus.datasource.devservices.enabled=false
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/reach
%local.quarkus.datasource.username=reach
%local.quarkus.datasource.password=reach
%local.quarkus.kafka.devservices.enabled=false
%local.kafka.bootstrap.servers=localhost:9092
%local.quarkus.vault.devservices.enabled=false
%local.quarkus.vault.url=http://localhost:8200
%local.quarkus.vault.authentication.client-token=reach-dev-root
%local.reach.dt.url=http://localhost:8089
%local.reach.s3.bucket=reach-local
%local.reach.s3.endpoint-override=http://localhost:9090
%local.reach.s3.path-style=true
%local.reach.github.api-url=http://localhost:8091
%local.reach.github.app-id=12345
%local.quarkus.vault.secret-config-kv-path."reach.github"=reach/github
# No cluster locally: FETCHING ends after the GitHub token is minted.
%local.reach.job.enabled=false
%local.quarkus.kubernetes-client.devservices.enabled=false
