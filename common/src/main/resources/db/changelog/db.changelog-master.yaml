# Liquibase master changelog (D-031). reachability-api applies it at start-up; other services only validate.
# Never edit a released changeset: add a new file and include it below.
databaseChangeLog:
  - include:
      file: changes/001-scan-schema.sql
      relativeToChangelogFile: true
  - include:
      file: changes/002-partition-maintenance.sql
      relativeToChangelogFile: true
  - include:
      file: changes/003-finding.sql
      relativeToChangelogFile: true
  - include:
      file: changes/004-policy-keys-lower-case.sql
      relativeToChangelogFile: true
