# The scan Job runner (architecture.md 3.4, 12). The controller sets the reach.scanner.* values through the Job's
# environment (REACH_SCANNER_DEADLINE, REACH_SCANNER_ARTIFACTORY_URL, ...).
quarkus.application.name=reach-scanner
quarkus.banner.enabled=false
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %-5p [%c{2.}] %s%e%n
quarkus.log.category."sootup".level=WARN
# Engines live in their own jars; index them so CDI finds every ReachabilityEngine.
quarkus.index-dependency.java-sootup.group-id=io.github.arikregev.reach
quarkus.index-dependency.java-sootup.artifact-id=java-sootup

reach.scanner.scan-id=${SCAN_ID:}
# Artifactory repository per build tool (D-011). Gradle resolves Maven artifacts, so both use the Maven virtual repo.
reach.scanner.artifactory.repositories.maven=maven-virtual
reach.scanner.artifactory.repositories.gradle=maven-virtual
